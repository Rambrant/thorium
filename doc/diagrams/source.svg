<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1904" viewBox="0 0 1180 1904" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22303c"/></marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#71818f" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1180" height="1904" fill="#ffffff"/>
  <text x="22" y="36" font-size="17.5" font-weight="600" fill="#22303c">Connect, Apply, Remove, Disconnect -- and why they nest</text>
  <text x="22" y="58" font-size="12.5" fill="#5b6b7a">The relay moves while the path is dead, at both ends of the sequence. Nothing here enforces that: hot switching is a wear argument, not a</text>
  <text x="22" y="76" font-size="12.5" fill="#5b6b7a">correctness one -- so instead of refusing it, Connect and Disconnect ask the driver whether its output was live and put the answer in the log.</text>
  <line x1="95" y1="152" x2="95" y2="1826" stroke="#b9c4cf" stroke-width="1.4" stroke-dasharray="3 4"/>
  <line x1="320" y1="152" x2="320" y2="1826" stroke="#b9c4cf" stroke-width="1.4" stroke-dasharray="3 4"/>
  <line x1="545" y1="152" x2="545" y2="1826" stroke="#b9c4cf" stroke-width="1.4" stroke-dasharray="3 4"/>
  <line x1="740" y1="152" x2="740" y2="1826" stroke="#b9c4cf" stroke-width="1.4" stroke-dasharray="3 4"/>
  <line x1="915" y1="152" x2="915" y2="1826" stroke="#b9c4cf" stroke-width="1.4" stroke-dasharray="3 4"/>
  <line x1="1080" y1="152" x2="1080" y2="1826" stroke="#b9c4cf" stroke-width="1.4" stroke-dasharray="3 4"/>
  <rect x="40" y="381" width="1128" height="780" fill="none" stroke="#a8762a" stroke-width="1.2" stroke-dasharray="6 4" rx="4"/>
  <rect x="40" y="381" width="123" height="20" fill="#a8762a" rx="3"/>
  <text x="46" y="395" font-size="10.5" font-weight="600" fill="#ffffff">bringing a rail up</text>
  <rect x="40" y="1199" width="1100" height="342" fill="none" stroke="#a8762a" stroke-width="1.2" stroke-dasharray="6 4" rx="4"/>
  <rect x="40" y="1199" width="283" height="20" fill="#a8762a" rx="3"/>
  <text x="46" y="1213" font-size="10.5" font-weight="600" fill="#ffffff">and taking it back down -- the exact inverse</text>
  <rect x="17" y="98" width="156" height="54" rx="5" fill="#e7f0fb" stroke="#2b6cb0" stroke-width="1.3"/>
  <text x="95" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">a test script</text>
  <text x="95" y="138" text-anchor="middle" font-size="8.5" fill="#5b6b7a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">suite/scripts/*.cpp</text>
  <rect x="230" y="98" width="180" height="54" rx="5" fill="#eef3f7" stroke="#3d5666" stroke-width="1.3"/>
  <text x="320" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Connect/Disconnect</text>
  <text x="320" y="138" text-anchor="middle" font-size="8.5" fill="#5b6b7a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">core/verbs/route.hpp</text>
  <rect x="461" y="98" width="168" height="54" rx="5" fill="#eef3f7" stroke="#3d5666" stroke-width="1.3"/>
  <text x="545" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Apply/Remove</text>
  <text x="545" y="138" text-anchor="middle" font-size="8.5" fill="#5b6b7a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">core/verbs/source.hpp</text>
  <rect x="662" y="98" width="156" height="54" rx="5" fill="#fdf4e4" stroke="#8a5a00" stroke-width="1.3"/>
  <text x="740" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hal::SwitchFabric</text>
  <text x="740" y="138" text-anchor="middle" font-size="8.5" fill="#5b6b7a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hal/fabric/switch_fabric.hpp</text>
  <rect x="843" y="98" width="144" height="54" rx="5" fill="#fdf4e4" stroke="#8a5a00" stroke-width="1.3"/>
  <text x="915" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">the driver</text>
  <text x="915" y="138" text-anchor="middle" font-size="8.5" fill="#5b6b7a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">a supply, via ADL</text>
  <rect x="1006" y="98" width="148" height="54" rx="5" fill="#eef3f7" stroke="#3d5666" stroke-width="1.3"/>
  <text x="1080" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">core::Journal</text>
  <text x="1080" y="138" text-anchor="middle" font-size="8.5" fill="#5b6b7a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">core/journal/journal.hpp</text>
  <rect x="324" y="180" width="441" height="157" rx="4" fill="#fffbeb" stroke="#d6bf7a" stroke-width="1.1"/>
  <text x="335" y="202" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">The order the hardware cares about, written out as a rig's real</text>
  <text x="335" y="217" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">power-up in suite/scripts/rig_power_on.cpp:</text>
  <text x="335" y="247" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">    Connect, Apply  ...  Remove, Disconnect</text>
  <text x="335" y="277" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">It nests rather than mirrors, and both ends are the same</text>
  <text x="335" y="292" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">mechanism: contacts that part under current draw an arc, and</text>
  <text x="335" y="307" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">contacts closing onto a live supply bounce, breaking an</text>
  <text x="335" y="322" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">energised circuit on each bounce.</text>
  <line x1="97" y1="427" x2="313" y2="427" stroke="#22303c" stroke-width="1.5" marker-end="url(#call)"/>
  <text x="208" y="419" text-anchor="middle" font-size="11.5" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Connect( DcP5.dc())</text>
  <line x1="322" y1="463" x2="908" y2="463" stroke="#22303c" stroke-width="1.5" marker-end="url(#call)"/>
  <text x="618" y="455" text-anchor="middle" font-size="11.5" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">isEnergised( config)?</text>
  <line x1="913" y1="499" x2="327" y2="499" stroke="#71818f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ret)"/>
  <text x="618" y="491" text-anchor="middle" font-size="11.5" fill="#71818f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">false -- cold, which is the point</text>
  <rect x="93" y="535" width="455" height="202" rx="4" fill="#fffbeb" stroke="#d6bf7a" stroke-width="1.1"/>
  <text x="104" y="557" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">core::detail::energisedNow asks it, through an unqualified</text>
  <text x="104" y="572" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">isEnergised -- so this header stays free of any hal:: type.</text>
  <text x="104" y="602" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Optional, because most configs Connect is called with are not</text>
  <text x="104" y="617" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sources at all: asking whether a UART is live is not a question.</text>
  <text x="104" y="632" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">But optional in the one shape that cannot lose the check by</text>
  <text x="104" y="647" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">omission -- "has an applyDriver" is exactly "Apply can energise</text>
  <text x="104" y="662" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">this", so a config with one and no isEnergised is a static_assert</text>
  <text x="104" y="677" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">naming the missing member, not a quiet report of "cold".</text>
  <text x="104" y="707" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Not asked at all on a detached run: the driver call is guarded by</text>
  <text x="104" y="722" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">bench().isAttached(), so nothing to switch means nothing hot.</text>
  <line x1="322" y1="771" x2="733" y2="771" stroke="#22303c" stroke-width="1.5" marker-end="url(#call)"/>
  <text x="530" y="763" text-anchor="middle" font-size="11.5" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">connect( path)</text>
  <line x1="322" y1="807" x2="1073" y2="807" stroke="#22303c" stroke-width="1.5" marker-end="url(#call)"/>
  <text x="700" y="799" text-anchor="middle" font-size="11.5" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">post( Verb::Connect, hot = false)</text>
  <line x1="97" y1="843" x2="538" y2="843" stroke="#22303c" stroke-width="1.5" marker-end="url(#call)"/>
  <text x="320" y="835" text-anchor="middle" font-size="11.5" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Apply( DcP5.dc().voltage( 5_V))</text>
  <line x1="547" y1="879" x2="908" y2="879" stroke="#22303c" stroke-width="1.5" marker-end="url(#call)"/>
  <text x="730" y="871" text-anchor="middle" font-size="11.5" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">applyDriver( config)</text>
  <rect x="704" y="915" width="421" height="82" rx="4" fill="#fffbeb" stroke="#d6bf7a" stroke-width="1.1"/>
  <text x="715" y="937" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Only when bench().isAttached(). A replayed run takes its</text>
  <text x="715" y="952" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">readings from a file, and energising a rail for real while</text>
  <text x="715" y="967" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">doing so is the one thing it must not do -- but the event is</text>
  <text x="715" y="982" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">posted either way, and says which happened.</text>
  <line x1="547" y1="1031" x2="1073" y2="1031" stroke="#22303c" stroke-width="1.5" marker-end="url(#call)"/>
  <text x="812" y="1023" text-anchor="middle" font-size="11.5" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">post( Verb::Apply)</text>
  <rect x="735" y="1067" width="421" height="52" rx="4" fill="#fffbeb" stroke="#d6bf7a" stroke-width="1.1"/>
  <text x="746" y="1089" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Posted after the driver call, never before: if applyDriver</text>
  <text x="746" y="1104" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">throws, nothing was applied and nothing should claim it was.</text>
  <line x1="97" y1="1245" x2="538" y2="1245" stroke="#22303c" stroke-width="1.5" marker-end="url(#call)"/>
  <text x="320" y="1237" text-anchor="middle" font-size="11.5" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Remove( DcP5.dc())</text>
  <line x1="547" y1="1281" x2="908" y2="1281" stroke="#22303c" stroke-width="1.5" marker-end="url(#call)"/>
  <text x="730" y="1273" text-anchor="middle" font-size="11.5" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">removeDriver( config)</text>
  <line x1="547" y1="1317" x2="1073" y2="1317" stroke="#22303c" stroke-width="1.5" marker-end="url(#call)"/>
  <text x="812" y="1309" text-anchor="middle" font-size="11.5" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">post( Verb::Remove)</text>
  <line x1="97" y1="1353" x2="313" y2="1353" stroke="#22303c" stroke-width="1.5" marker-end="url(#call)"/>
  <text x="208" y="1345" text-anchor="middle" font-size="11.5" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Disconnect( DcP5.dc())</text>
  <line x1="322" y1="1389" x2="908" y2="1389" stroke="#22303c" stroke-width="1.5" marker-end="url(#call)"/>
  <text x="618" y="1381" text-anchor="middle" font-size="11.5" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">isEnergised( config)?</text>
  <line x1="913" y1="1425" x2="327" y2="1425" stroke="#71818f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ret)"/>
  <text x="618" y="1417" text-anchor="middle" font-size="11.5" fill="#71818f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">false</text>
  <line x1="322" y1="1461" x2="733" y2="1461" stroke="#22303c" stroke-width="1.5" marker-end="url(#call)"/>
  <text x="530" y="1453" text-anchor="middle" font-size="11.5" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">disconnect( path)</text>
  <line x1="322" y1="1497" x2="1073" y2="1497" stroke="#22303c" stroke-width="1.5" marker-end="url(#call)"/>
  <text x="700" y="1489" text-anchor="middle" font-size="11.5" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">post( Verb::Disconnect, hot = false)</text>
  <rect x="331" y="1569" width="428" height="217" rx="4" fill="#fffbeb" stroke="#d6bf7a" stroke-width="1.1"/>
  <text x="342" y="1591" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Swap Apply above Connect and nothing refuses it. That is</text>
  <text x="342" y="1606" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">deliberate -- a safety interlock dropping a connection the</text>
  <text x="342" y="1621" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">instant it is asked to should not first wait out a supply's</text>
  <text x="342" y="1636" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ramp-down, and that call belongs to whoever writes the</text>
  <text x="342" y="1651" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sequence. What changed is that the choice is no longer</text>
  <text x="342" y="1666" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">invisible: energisedNow() is asked at the moment the contact</text>
  <text x="342" y="1681" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">moves, and a true lands in the event.</text>
  <text x="342" y="1711" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Which is what lets the acceptance suite read it back out of a</text>
  <text x="342" y="1726" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">run's own machine log -- see acceptance/test_acceptance.cpp,</text>
  <text x="342" y="1741" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">NoShippedScriptOrHookMovesARelayUnderLoad. Getting the order</text>
  <text x="342" y="1756" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">wrong is not a build error and not a failing script; it is a</text>
  <text x="342" y="1771" font-size="11" fill="#22303c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">line in the log that a test goes looking for.</text>
  <line x1="22" y1="1836" x2="1158" y2="1836" stroke="#b9c4cf" stroke-width="1"/>
  <text x="22" y="1856" font-size="11" fill="#5b6b7a">Setup is the fourth verb of this family and is not on the diagram: it tells an instrument how to behave without making it do anything, so it moves no</text>
  <text x="22" y="1872" font-size="11" fill="#5b6b7a">relay and energises nothing. core/verbs/interlock.hpp is why this hazard is recorded where an ammeter across a live rail is refused outright.</text>
  <text x="22" y="1888" font-size="11" fill="#5b6b7a">Solid arrow: a call.   Dashed: what it returns.</text>
</svg>
